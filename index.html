<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iOS Dev Toolbox - iOS 开发通用小工具</title>
    <meta
      name="description"
      content="一个本地运行的网页版 iOS 开发通用小工具，包含加密、正则、进制转换、图片识别代码、复杂控件代码生成等。"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <button class="icon-button" id="toggleSidebar" aria-label="展开或收起工具列表" title="工具列表">
          <span class="icon">☰</span>
        </button>
        <span class="logo-mark">iOS</span>
        <strong>iOS Dev Toolbox</strong>
      </div>
      <div class="top-actions">
        <label class="search-wrap" for="toolSearch">
          <span class="icon">⌕</span>
          <input id="toolSearch" type="search" placeholder="搜索工具、Swift、Regex、Hash..." />
        </label>
        <button class="icon-button" id="themeToggle" aria-label="切换深色模式" title="切换深色模式">
          <span class="icon">◐</span>
        </button>
      </div>
    </header>

    <main class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span>工具分类</span>
          <span id="toolCount"></span>
        </div>
        <nav id="categoryNav" aria-label="工具分类"></nav>
      </aside>

      <section class="workspace">
        <section class="section-head" id="categoryHero">
          <div>
            <span class="eyebrow">本地运行 · iOS 开发高频场景</span>
            <h1>iOS 开发通用小工具</h1>
            <p>选择左侧分类，中间只显示当前分类下的工具目录，右侧直接进入使用。</p>
          </div>
        </section>

        <section class="tool-layout">
          <div>
            <div class="column-title">
              <span id="currentCategoryName"></span>
              <span id="currentCategoryCount"></span>
            </div>
            <div class="tool-grid" id="toolGrid" aria-label="工具列表"></div>
          </div>
          <article class="tool-panel" id="toolPanel" aria-live="polite"></article>
        </section>
      </section>
    </main>

    <template id="copyButtonTemplate">
      <button class="copy-btn" type="button">复制</button>
    </template>

    <script src="app.js"></script>
    <script>
      (() => {
        const descriptions = {
          "加密与编码": "处理接口签名、Token 调试、Base64 和 URL 参数编码，全部在浏览器本地完成。",
          "文本与正则": "调试正则、整理日志、格式化 JSON，并快速生成 iOS 模型代码草稿。",
          "转换与速查": "进制、颜色、时间戳这些高频转换集中在这里，适合开发和排查问题时快速查。",
          "iOS 代码生成": "生成 Vision 图片识别、复杂控件和 App 配置相关 Swift 模板，减少重复搭架子。"
        };
        let selectedCategory = categories[0].name;
        const byCategory = (name) => categories.find((item) => item.name === name) || categories[0];
        const toolCategory = (id) => categories.find((item) => item.tools.some((tool) => tool.id === id));

        visibleTools = function () {
          const q = filter.trim().toLowerCase();
          const tools = byCategory(selectedCategory).tools.map((tool) => ({ ...tool, category: selectedCategory }));
          return q ? tools.filter((tool) => `${tool.title} ${tool.desc} ${tool.category}`.toLowerCase().includes(q)) : tools;
        };

        renderNav = function () {
          $("#categoryNav").innerHTML = categories
            .map(
              (category) => `<button class="nav-category ${category.name === selectedCategory ? "active" : ""}" data-category="${category.name}">
                <span class="nav-category-main">
                  <span class="tool-icon">${category.tools[0].icon}</span>
                  <span><strong>${category.name}</strong><small>${category.tools.map((tool) => tool.title).join(" / ")}</small></span>
                </span>
                <span class="nav-count">${category.tools.length}</span>
              </button>`
            )
            .join("");
        };

        renderGrid = function () {
          const tools = visibleTools();
          const category = byCategory(selectedCategory);
          $("#currentCategoryName").textContent = category.name;
          $("#currentCategoryCount").textContent = `${tools.length} / ${category.tools.length} 个`;
          $("#categoryHero").querySelector("h1").textContent = category.name;
          $("#categoryHero").querySelector("p").textContent = descriptions[selectedCategory];
          $("#toolGrid").innerHTML = tools.length
            ? tools
                .map(
                  (tool) => `<article class="tool-card ${tool.id === activeTool ? "active" : ""}" data-tool="${tool.id}" tabindex="0">
                    <div class="tool-icon">${tool.icon}</div>
                    <div><h3>${tool.title}</h3><p>${tool.desc}</p></div>
                  </article>`
                )
                .join("")
            : `<div class="empty-state">当前分类没有匹配的工具。</div>`;
        };

        document.addEventListener(
          "click",
          (event) => {
            const item = event.target.closest("[data-category]");
            if (!item) return;
            event.stopImmediatePropagation();
            selectedCategory = item.dataset.category;
            activeTool = visibleTools()[0]?.id || byCategory(selectedCategory).tools[0].id;
            render();
          },
          true
        );

        document.addEventListener(
          "click",
          (event) => {
            const item = event.target.closest("[data-tool]");
            if (!item) return;
            selectedCategory = toolCategory(item.dataset.tool)?.name || selectedCategory;
          },
          true
        );

        activeTool = byCategory(selectedCategory).tools[0].id;
        render();
      })();
    </script>
  </body>
</html>
